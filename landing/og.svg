<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"
     role="img" aria-label="Merlin Clips — paid for the views that survived">
  <!--
    The share card.

    Restraint is the brief: this sits beside a hundred other links in a
    timeline, and the ones that read as considered are the quiet ones. A cream
    ground, one line of type doing the work, and a single accent — the same dot
    that marks the brand in the site nav — instead of gradients, badges and
    glow.

    The claim leads and the name follows. Someone scrolling decides on the
    sentence, not on whose logo it is, and the sentence here is the whole
    product: a view counts once it has lasted.

    Margins are wider than the canvas implies. Renderers that fit a wide card
    into a square canvas trim top, bottom and right, so the composition sits
    inside roughly the middle eighty per cent and every element is
    left-aligned — a mark hanging off the right edge is the first thing to
    disappear, and a headline flush to the top is the second.
  -->
  <rect width="1200" height="630" fill="#FAF8F5"/>

  <g font-family="ui-serif, Georgia, 'Iowan Old Style', 'Times New Roman', serif" fill="#151310">
    <text x="96" y="250" font-size="82" font-weight="600" letter-spacing="-2.4">Paid for the views</text>
    <text x="96" y="336" font-size="82" font-weight="600" letter-spacing="-2.4">that survived.</text>
  </g>

  <text x="96" y="402" font-size="27" fill="#5C554C" letter-spacing="-0.2"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">A view is payable once it has held for twenty-four hours.</text>

  <line x1="96" y1="452" x2="700" y2="452" stroke="#E8E3DB" stroke-width="1"/>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <circle cx="102" cy="500" r="7" fill="#6D28D9"/>
    <text x="124" y="508" font-size="25" font-weight="600" fill="#151310"
          letter-spacing="-0.4">Merlin Clips</text>
    <text x="124" y="540" font-size="16" fill="#8B8378" letter-spacing="1.4"
          font-family="ui-monospace, 'SF Mono', Menlo, monospace">USDC ON BASE · MERLINCLIPS.COM</text>
  </g>
</svg>
