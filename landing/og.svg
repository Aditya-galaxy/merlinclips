<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="40%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="50%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f0c1b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle Radial Ambient Glow -->
  <circle cx="240" cy="315" r="350" fill="url(#glow)"/>
  <circle cx="1000" cy="150" r="300" fill="url(#glow)"/>

  <!-- Decorative Grid Overlay (Subtle) -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Container Box -->
  <rect x="70" y="70" width="1060" height="490" rx="32" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Logo Icon Container -->
  <g transform="translate(130, 150)">
    <rect width="140" height="140" rx="32" fill="url(#purpleGrad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <!-- Crescent Moon -->
    <path d="M 90 30 C 55 30 30 55 30 90 C 30 108 38 120 49 128 C 31 116 25 95 29 71 C 34 41 60 19 90 19 C 101 19 112 22 120 28 C 111 25 101 30 90 30 Z" fill="#ffffff"/>
    <!-- Star Sparkle -->
    <path d="M 85 75 Q 85 83 93 83 Q 85 83 85 91 Q 85 83 77 83 Q 85 83 85 75 Z" fill="#ffffff"/>
  </g>

  <!-- Header Title -->
  <text x="310" y="215" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-weight="800" font-size="56" fill="#ffffff" letter-spacing="-1.5">Merlin Clips</text>

  <!-- Tagline Subtitle -->
  <text x="310" y="265" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-weight="500" font-size="24" fill="#c084fc" letter-spacing="-0.5">Autonomous Creator Payout Engine on Base</text>

  <!-- Main Headline Banner -->
  <text x="130" y="365" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-weight="700" font-size="40" fill="#ffffff" letter-spacing="-1">Pays creators only for views that survive</text>
  <text x="130" y="415" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-weight="700" font-size="40" fill="#a855f7" letter-spacing="-1">a 24-hour retention hold.</text>

  <!-- Tech Badges Bar -->
  <g transform="translate(130, 470)">
    <!-- Badge 1: Base USDC -->
    <rect x="0" y="0" width="180" height="42" rx="21" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="22" cy="21" r="6" fill="#10b981"/>
    <text x="36" y="26" font-family="ui-monospace, monospace" font-size="15" font-weight="700" fill="#34d399">USDC on Base</text>

    <!-- Badge 2: Gemini AI -->
    <rect x="200" y="0" width="210" height="42" rx="21" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="222" cy="21" r="6" fill="#a855f7"/>
    <text x="236" y="26" font-family="ui-monospace, monospace" font-size="15" font-weight="700" fill="#c084fc">Gemini AI Verifier</text>

    <!-- Badge 3: 24h Dwell -->
    <rect x="430" y="0" width="220" height="42" rx="21" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="452" cy="21" r="6" fill="#fbbf24"/>
    <text x="466" y="26" font-family="ui-monospace, monospace" font-size="15" font-weight="700" fill="#fbbf24">24h Retention Hold</text>

    <!-- URL on Right -->
    <text x="890" y="26" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#ffffff" fill-opacity="0.8" text-anchor="end">merlinclips.com</text>
  </g>
</svg>
